<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS 语域对照表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c8452a;
    --gold: #d4a843;
    --muted: #6b6560;
    --card: #fffdf7;
    --border: #e0d8cc;
    --spoken: #2d6a4f;
    --written: #1d3557;
    --spoken-bg: #d8f3dc;
    --written-bg: #dbe9f4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    background: var(--ink);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 200px; height: 200px;
    background: var(--accent);
    opacity: 0.15;
    border-radius: 50%;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -40px; right: -40px;
    width: 150px; height: 150px;
    background: var(--gold);
    opacity: 0.12;
    border-radius: 50%;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: #fff;
    letter-spacing: 0.02em;
    position: relative;
    z-index: 1;
  }

  h1 span { color: var(--gold); }

  .subtitle {
    color: #aaa;
    font-size: 0.85rem;
    margin-top: 0.5rem;
    font-weight: 300;
    position: relative;
    z-index: 1;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 1.25rem 1.5rem;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .search-wrap {
    flex: 1;
    min-width: 180px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    padding: 0.6rem 1rem 0.6rem 2.4rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
    color: var(--muted);
  }

  .filters {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 0.45rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    font-weight: 500;
  }

  .filter-btn.active, .filter-btn:hover {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .stats {
    margin-left: auto;
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .legend {
    display: flex;
    gap: 1.5rem;
    padding: 0.75rem 1.5rem;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
    flex-wrap: wrap;
  }

  .legend-item { display: flex; align-items: center; gap: 0.4rem; color: var(--muted); }

  .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: 500;
  }

  .badge-s { background: var(--spoken-bg); color: var(--spoken); }
  .badge-w { background: var(--written-bg); color: var(--written); }
  .badge-b { background: #f3e5f5; color: #6a1b9a; }

  .category-section { padding: 1rem 1.5rem 0.5rem; }

  .category-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .category-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 0.6rem;
    padding: 0 1.5rem 1rem;
  }

  .pair {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: default;
  }

  .pair:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    border-color: #ccc;
  }

  .num {
    font-size: 0.65rem;
    color: var(--muted);
    min-width: 22px;
    font-weight: 500;
    opacity: 0.6;
  }

  .spoken-word {
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--spoken);
    min-width: 110px;
  }

  .arrow {
    color: var(--accent);
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .written-word {
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--written);
    flex: 1;
  }

  .use-badge {
    flex-shrink: 0;
  }

  .no-results {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .col-headers {
    display: flex;
    gap: 0.75rem;
    padding: 0.5rem 1.5rem;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  .col-spoken { min-width: 140px; color: var(--spoken); }
  .col-written { color: var(--written); }

  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    margin-top: 1rem;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; padding: 0 1rem 1rem; }
    .controls { padding: 1rem; }
    .category-section { padding: 0.75rem 1rem 0.25rem; }
  }
</style>
</head>

<header>
  <h1>IELTS <span>语域对照表</span></h1>
  <p class="subtitle">口语用词 vs 写作用词 · 100+ 高频对照组</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="搜索单词..." oninput="filterPairs()">
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="filterCat('all', this)">全部</button>
    <button class="filter-btn" onclick="filterCat('verb', this)">动词</button>
    <button class="filter-btn" onclick="filterCat('adj', this)">形容词</button>
    <button class="filter-btn" onclick="filterCat('adv', this)">副词</button>
    <button class="filter-btn" onclick="filterCat('phrase', this)">短语</button>

  <span class="stats" id="stats"></span>

<div class="legend">

<footer>共 <strong id="total-count"></strong> 组语域对照 · 雅思备考专用</footer>

function getBadge(use) {
  if (use === 's') return '<span class="badge badge-s">口语</span>';
  if (use === 'w') return '<span class="badge badge-w">写作</span>';
  return '<span class="badge badge-b">两用</span>';

function renderAll(items) {
  const container = document.getElementById('main-content');
  container.innerHTML = '';
  document.getElementById('stats').textContent = `显示 ${items.length} 组`;

  if (items.length === 0) {
    container.innerHTML = '<div class="no-results">没有找到匹配的词组，试试其他关键词</div>';
    return;
  }

  const groups = {};
  items.forEach((item, i) => {
    if (!groups[item.group]) groups[item.group] = [];
    groups[item.group].push({ ...item, idx: i + 1 });
  });

  Object.entries(groups).forEach(([group, pairs]) => {
    const sec = document.createElement('div');
    sec.innerHTML = `<div class="category-section"><div class="category-label">${group}</div></div>`;
    container.appendChild(sec);

    const grid = document.createElement('div');
    grid.className = 'grid';
    pairs.forEach(p => {
      const div = document.createElement('div');
      div.className = 'pair';
      div.innerHTML = `
        <span class="num">${p.idx}</span>
        <span class="spoken-word">${p.spoken}</span>
        <span class="arrow">→</span>
        <span class="written-word">${p.written}</span>
        <span class="use-badge">${getBadge(p.use)}</span>
      `;
      grid.appendChild(div);
    });
    container.appendChild(grid);
  });
}

function filterPairs() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = data.filter(p => currentCat === 'all' || p.cat === currentCat);
  if (q) filtered = filtered.filter(p =>
    p.spoken.toLowerCase().includes(q) || p.written.toLowerCase().includes(q)
  );
  renderAll(filtered);
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterPairs();
}

document.getElementById('total-count').textContent = data.length;
renderAll(data);
</script>
</body>
</html>
