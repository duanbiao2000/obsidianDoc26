
<style>

  .tag-c { background: #633806; color: #FAC775; }
  .tag-d { background: #3C3489; color: #CECBF6; }

}

}

  font-family: var(--font-sans); transition: all .15s;
}

</style>

<script>
const CONCEPTS = [
  // === 评分标准层 ===
  { n:1, title:"Fluency & Coherence (FC)", desc:"语言流畅度与逻辑连贯性，占25%分值。核心不是语速，而是思路不断、停顿自然。", tag:"评分标准", tc:"tag-a" },
  { n:2, title:"Lexical Resource (LR)", desc:"词汇资源，占25%。考查多样性、精准度与语境适配，不是词汇量的堆砌。", tag:"评分标准", tc:"tag-a" },
  { n:3, title:"Grammatical Range & Accuracy (GRA)", desc:"语法范围与准确度，占25%。范围=能用多种句型；准确=不影响沟通的错误。", tag:"评分标准", tc:"tag-a" },
  { n:4, title:"Pronunciation (Pron)", desc:"发音，占25%。考查清晰度与可理解性，非口音。连读、语调、节奏都在此维度。", tag:"评分标准", tc:"tag-a" },
  { n:5, title:"Band descriptor 7.0 临界特征", desc:"7分临界：偶有重复/自我修正，词汇灵活使用，语法偶有错误但不影响沟通。", tag:"评分标准", tc:"tag-a" },
  { n:6, title:"Band descriptor 6.0 vs 7.0 差异", desc:"6→7的跳跃关键：从「能说清楚」到「说得流畅且有深度」，停顿质量是分水岭。", tag:"评分标准", tc:"tag-a" },
  { n:7, title:"Repair strategies（自我修正）", desc:"自我修正不扣分，但频繁修正说明输出监控过载。高分考生修正后即继续，不卡壳。", tag:"评分标准", tc:"tag-a" },
  { n:8, title:"Communicative effectiveness", desc:"考官底层判断：这个人能否在真实场景中用英语完成沟通任务？超越考试思维的核心。", tag:"评分标准", tc:"tag-a" },

  // === 流利度层 ===
  { n:9, title:"Filler words vs fillers", desc:"um/uh是焦虑型填充；well/let me think是思考型过渡。后者不扣分，前者频繁则影响FC。", tag:"流利度", tc:"tag-b" },
  { n:10, title:"Chunking（语块输出）", desc:"以意群为单位输出，而非逐词翻译。如「in the long run」作为整体激活，不拆开组装。", tag:"流利度", tc:"tag-b" },
  { n:11, title:"Processing time（内部加工速度）", desc:"流利度的真正瓶颈是内容生成速度，不是嘴巴。提升方法：增加话题预储，减少临场构思。", tag:"流利度", tc:"tag-b" },
  { n:12, title:"Automaticity（自动化程度）", desc:"常用句型达到自动化，才能把认知资源腾出来思考内容。目标：结构不占脑容量。", tag:"流利度", tc:"tag-b" },
  { n:13, title:"Discourse marker使用逻辑", desc:"Actually/Honestly/To be fair等不是装饰词，是信号词——告诉听者逻辑关系的方向。", tag:"流利度", tc:"tag-b" },
  { n:14, title:"False starts（冲口而出再改）", desc:"「I think— well, what I actually believe is...」属正常现象，不构成扣分，但需快速接续。", tag:"流利度", tc:"tag-b" },
  { n:15, title:"Pacing（节奏控制）", desc:"快慢对比制造信息重量感。重要论点放慢，例子可加速。单一语速=无强调=无层次感。", tag:"流利度", tc:"tag-b" },
  { n:16, title:"Response latency（反应延迟）", desc:"Part 1允许0.5-1秒内接话；Part 2有1分钟准备；Part 3可用「That's quite a thought-provoking question」争取时间。", tag:"流利度", tc:"tag-b" },

  // === 词汇层 ===
  { n:17, title:"Collocation accuracy（搭配准确度）", desc:"high possibility(✗) → strong possibility(✓)。搭配错误是6分考生的典型特征，比词汇量更关键。", tag:"词汇", tc:"tag-c" },
  { n:18, title:"Idiomatic language", desc:"地道表达不等于俚语。「It's a double-edged sword」比「it has good and bad sides」更高级。", tag:"词汇", tc:"tag-c" },
  { n:19, title:"Paraphrasing ability", desc:"能用不同词表达同一个意思，是LR高分的直接证明。练习：每句核心词至少备两种说法。", tag:"词汇", tc:"tag-c" },
  { n:20, title:"Lexical precision（词义精准）", desc:"用「devastating」不用「very bad」；用「sceptical」不用「not sure」。精准>华丽。", tag:"词汇", tc:"tag-c" },
  { n:21, title:"Topic-specific vocabulary", desc:"每个Part 2话题备5-8个专属词。谈科技用disruption/ecosystem/algorithm，谈健康用sedentary/well-being。", tag:"词汇", tc:"tag-c" },
  { n:22, title:"Hedging language（模糊化表达）", desc:"「tend to/arguably/it's fair to say」体现学术理性，避免绝对化陈述带来的逻辑漏洞。", tag:"词汇", tc:"tag-c" },
  { n:23, title:"Connotation awareness（词义色彩）", desc:"slim vs skinny, confident vs arrogant——词的情感色彩传递你的立场和品味。", tag:"词汇", tc:"tag-c" },
  { n:24, title:"Discourse-level vocabulary", desc:"「This brings me to my main point」「What I mean is」——篇章层级的管理词汇，体现组织能力。", tag:"词汇", tc:"tag-c" },
  { n:25, title:"Nominalization（名词化）", desc:"「The development of technology has transformed...」比「Technology has developed and transformed」更书面且高级。", tag:"词汇", tc:"tag-c" },
  { n:26, title:"Collocational chunking", desc:"背词以搭配为单位：「make a significant contribution」而非单独背significant。", tag:"词汇", tc:"tag-c" },
  { n:27, title:"Low-frequency vs high-frequency lexis", desc:"7+分需要展示低频但准确的词汇。「exacerbate」「pivotal」「nuanced」比简单词有辨别度。", tag:"词汇", tc:"tag-c" },
  { n:28, title:"Lexical variation（同义替换）", desc:"全文不重复核心词。谈「问题」：issue→challenge→concern→dilemma轮换使用。", tag:"词汇", tc:"tag-c" },

  // === 语法层 ===
  { n:29, title:"Complex sentence structures", desc:"从句嵌套、条件句、让步句——不是展示语法的炫技，是精确表达复杂思想的必要工具。", tag:"语法", tc:"tag-d" },
  { n:30, title:"Tense consistency（时态一致性）", desc:"叙述过去事件全用过去时，假设用虚拟语气。时态跳跃是常见失分点，自我监控优先修正。", tag:"语法", tc:"tag-d" },
  { n:31, title:"Conditionals（条件句）", desc:"If I had studied harder, I would have... (反事实)。Part 3高频结构，展示假设推理能力。", tag:"语法", tc:"tag-d" },
  { n:32, title:"Passive voice应用逻辑", desc:"主动vs被动不是风格选择，是信息焦点选择。「Technology is being misused」vs「People are misusing technology」强调点不同。", tag:"语法", tc:"tag-d" },
  { n:33, title:"Relative clauses（定语从句）", desc:"「The reason why I feel this way is that...」「The city where I grew up...」精准定位信息，是流利连贯的重要工具。", tag:"语法", tc:"tag-d" },
  { n:34, title:"Modal verbs语义层次", desc:"could/might/should/must各自的确定度不同。「It could be argued」vs「It must be」表达不同的把握程度。", tag:"语法", tc:"tag-d" },
  { n:35, title:"Inversion for emphasis", desc:"「Not only does it...but also」「Rarely have I seen」——倒装句在Part 3中展示GRA范围，但一次足够。", tag:"语法", tc:"tag-d" },
  { n:36, title:"Articles usage（冠词使用）", desc:"a/the/零冠词是非母语者最难自动化的系统。关键：the=已知信息；a=引入新信息；零冠词=泛指类别。", tag:"语法", tc:"tag-d" },
  { n:37, title:"Gerund vs infinitive对比", desc:"I enjoy swimming(✓) vs I enjoy to swim(✗)。动名词vs不定式的搭配是搭配准确度的重要组成。", tag:"语法", tc:"tag-d" },
  { n:38, title:"Ellipsis & substitution", desc:"避免重复的语法手段：「I think it's important, and so does my friend」。口语中体现自然流畅。", tag:"语法", tc:"tag-d" },

  // === 口语结构层 ===
  { n:39, title:"Part 1答题策略（Direct + Extend）", desc:"直接回答+1-2句延伸，不超过4句。Part 1不需要论证，需要自然、即时、有个人色彩。", tag:"口语结构", tc:"tag-e" },
  { n:40, title:"Part 2话题卡解读策略", desc:"4个bullet points只是支架，不是必须逐一回答。围绕一个core story展开，比逐点更流畅。", tag:"口语结构", tc:"tag-e" },
  { n:41, title:"Part 2 1分钟笔记策略", desc:"记关键词而非完整句，重点列出：时间线+核心事件+个人感受。不要写出会被你照读的句子。", tag:"口语结构", tc:"tag-e" },
  { n:42, title:"Part 3抽象话题处理", desc:"从具体例子入手再升华到普遍规律。「In my personal experience → but broadly speaking → I think society...」", tag:"口语结构", tc:"tag-e" },
  { n:43, title:"Follow-up question处理", desc:"考官追问=你的答案需要深化，不是否定。继续原有方向但增加层次，不要推翻前面说的内容。", tag:"口语结构", tc:"tag-e" },
  { n:44, title:"2分钟时间分配（Part 2）", desc:"理想分配：背景介绍(20秒)+核心内容(80秒)+个人反思(20秒)。卡表练习直到不需要计时。", tag:"口语结构", tc:"tag-e" },
  { n:45, title:"Opinion signalling", desc:"「From my perspective / As far as I can tell / I'm inclined to think」——立场表达词多元化，不只靠I think。", tag:"口语结构", tc:"tag-e" },
  { n:46, title:"Concession structure（让步转折）", desc:"「While I can see the appeal of X, I still believe Y because...」——展示思维深度的核心句式。", tag:"口语结构", tc:"tag-e" },
  { n:47, title:"Exemplification策略", desc:"举例不是为了填充时间，是为了让抽象论点可验证。好例子：具体+贴近生活+与论点因果相连。", tag:"口语结构", tc:"tag-e" },
  { n:48, title:"Signposting language", desc:"「What I mean by that is / Let me elaborate on / To give you a concrete example」——引导考官跟着你的逻辑走。", tag:"口语结构", tc:"tag-e" },

  // === 发音层 ===
  { n:49, title:"Word stress规律", desc:"多音节词的重音位置影响可理解度。PHOtograph vs phoTOGraphy——名词动词重音位置不同。", tag:"发音", tc:"tag-a" },
  { n:50, title:"Sentence stress（句子重音）", desc:"每句话有1-2个核心信息词需重读。重读错误导致沟通焦点偏移，是发音扣分的主要原因。", tag:"发音", tc:"tag-a" },
  { n:51, title:"Intonation patterns（语调模式）", desc:"列举用上升调，结束用下降调，问题用上升调（是非问）或下降调（wh-问）。", tag:"发音", tc:"tag-a" },
  { n:52, title:"Linking sounds（连读）", desc:"「turn it off」念作「tur-ni-toff」。连读是流利度的声学基础，缺乏连读=一字一顿=机器感。", tag:"发音", tc:"tag-a" },
  { n:53, title:"Elision（省音）", desc:"「next day」省略[t]→「nex day」，「going to」→「gonna」。自然口语中省音不是懒，是规则。", tag:"发音", tc:"tag-a" },
  { n:54, title:"Assimilation（同化）", desc:"「ten boys」→「tem boys」，[n]在双唇音前变[m]。理解同化能提升听力，掌握同化能提升发音自然度。", tag:"发音", tc:"tag-a" },
  { n:55, title:"Schwa（弱化元音/ə/）", desc:"英语中最常见的音，出现在非重读音节。「about」「teacher」「camera」中的非重读音节都是/ə/。", tag:"发音", tc:"tag-a" },
  { n:56, title:"Minimal pairs练习法", desc:"ship/sheep, hit/heat, bad/bed——聚焦容易混淆的音对进行辨析训练，比泛读有效10倍。", tag:"发音", tc:"tag-a" },

  // === 话题内容层 ===
  { n:57, title:"Personal narrative结构", desc:"个人故事的黄金结构：设定背景→核心事件→困难/转折→解决→反思/意义。", tag:"话题内容", tc:"tag-b" },
  { n:58, title:"Abstract topic framework", desc:"抽象话题答题框架：观点陈述→原因分析（2条）→例子→让步→坚持立场。", tag:"话题内容", tc:"tag-b" },
  { n:59, title:"Sensory details（感官细节）", desc:"「The smell of rain on hot pavement」「The deafening noise of the crowd」——感官细节让叙述立体。", tag:"话题内容", tc:"tag-b" },
  { n:60, title:"Emotion & reflection（情感与反思）", desc:"高分答案的区别在于：不只说发生了什么，还说它对你意味着什么。加入情感层和反思层。", tag:"话题内容", tc:"tag-b" },
  { n:61, title:"Contrast structure（对比结构）", desc:"「Before vs after」「Then vs now」「My country vs other countries」——对比天然制造话题深度。", tag:"话题内容", tc:"tag-b" },
  { n:62, title:"Cause-effect reasoning", desc:"「This has led to / As a result / The knock-on effect is」——因果推理链是Part 3高分的核心能力。", tag:"话题内容", tc:"tag-b" },
  { n:63, title:"Balanced perspective（平衡视角）", desc:"Part 3不需要你「正确」，需要你「有深度」。给出两面论点后坚定选择立场，比骑墙更高分。", tag:"话题内容", tc:"tag-b" },
  { n:64, title:"Hypothetical reasoning（假设推理）", desc:"「If that were the case, we'd probably see...」——假设句激活GRA高分区，同时展示批判性思维。", tag:"话题内容", tc:"tag-b" },
  { n:65, title:"Comparison & contrast signalling", desc:"whereas/in contrast/on the other hand的精确使用。注意：however表转折，whereas表平行对比，语义不同。", tag:"话题内容", tc:"tag-b" },
  { n:66, title:"Data & evidence integration", desc:"「According to a recent survey / Research suggests / I read somewhere that」——引用数据增加说服力，不需要精确数字。", tag:"话题内容", tc:"tag-b" },

  // === 互动策略层 ===

let activeFilter = 'all';

function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['c100','m20','e5'][i] === id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === id));
}

function renderFilters() {
  const tags = ['all', ...new Set(CONCEPTS.map(c => c.tag))];
  const bar = document.getElementById('concept-filters');
  bar.innerHTML = tags.map(t => `<button class="filter-btn${t==='all'?' on':''}" onclick="filterConcepts('${t}')">${t==='all'?'全部':t}<span class="count-badge">${t==='all'?CONCEPTS.length:CONCEPTS.filter(c=>c.tag===t).length}</span></button>`).join('');
}

function filterConcepts(tag) {
  activeFilter = tag;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('on', b.textContent.startsWith(tag==='all'?'全部':tag)));
  renderConcepts();
}

function renderConcepts() {
  const items = activeFilter === 'all' ? CONCEPTS : CONCEPTS.filter(c => c.tag === activeFilter);
  document.getElementById('concept-grid').innerHTML = items.map(c => `
    <div class="card" onclick="sendPrompt('详细解释雅思口语核心概念：${c.title}，包括实战应用和练习方法')">
      <div class="card-num">#${String(c.n).padStart(2,'0')}</div>
      <div class="card-title">${c.title}</div>
      <div class="card-desc">${c.desc}</div>
      <span class="card-tag ${c.tc}">${c.tag}</span>
    </div>`).join('');
}

function renderModels() {
  document.getElementById('model-list').innerHTML = MODELS.map(m => `
    <div class="model-card" onclick="sendPrompt('详细解释雅思口语思维模型：${m.name}，给出3个不同话题的应用示例')">
      <div class="model-header">
        <span class="model-num">${m.n}</span>
        <span class="model-name">${m.name}</span>
      </div>
      <div class="model-meta">${m.meta}</div>
      <div class="model-body">${m.body.replace(/\n/g,'<br>')}</div>
      <div class="model-example">${m.example.replace(/\n/g,'<br>')}</div>
    </div>`).join('');
}

function renderExperts() {
  document.getElementById('expert-list').innerHTML = EXPERTS.map(e => `
    <div class="expert-card">
      <div class="expert-header">
        <div class="expert-avatar" style="background:${e.lbg};color:${e.ltx}">${e.letter}</div>
        <div class="expert-info">
          <div class="name">${e.name}</div>
          <div class="role">${e.role}</div>
        </div>
      </div>
      <ul class="logic-list">${e.logics.map(l=>`<li><span class="logic-bullet">${l.icon}</span><span>${l.text}</span></li>`).join('')}</ul>
    </div>`).join('');
}

renderFilters();
renderConcepts();
renderModels();
renderExperts();
</script>
