* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1rem 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.controls select, .controls input { font-size: 13px; padding: 6px 10px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); }
.controls input { flex: 1; min-width: 140px; }
.stat { font-size: 13px; color: var(--color-text-secondary); margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s; position: relative; }
.card:hover { border-color: var(--color-border-secondary); }
.card.learned { border-left: 3px solid #1D9E75; }
.tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px; margin-bottom: 6px; font-weight: 500; }
.tag.adj { background: #EEEDFE; color: #3C3489; }
.tag.v { background: #E1F5EE; color: #085041; }
.tag.n { background: #FAECE7; color: #712B13; }
.tag.adv { background: #E6F1FB; color: #0C447C; }
.tag.phrase { background: #FAEEDA; color: #633806; }
.word { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
.arrow { font-size: 12px; color: var(--color-text-tertiary); margin: 2px 0; }
.antonym { font-size: 14px; color: var(--color-text-secondary); }
.meaning { font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px; display: none; }
.card.open .meaning { display: block; }
.learn-btn { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 2px 7px; border: 0.5px solid var(--color-border-tertiary); border-radius: 4px; background: transparent; color: var(--color-text-secondary); cursor: pointer; }
.learn-btn:hover { background: var(--color-background-secondary); }
.card.learned .learn-btn { color: #1D9E75; border-color: #1D9E75; }
.tab-bar { display: flex; gap: 4px; margin-bottom: 12px; }
.tab { font-size: 13px; padding: 5px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); cursor: pointer; }
.tab.active { background: var(--color-background-secondary); color: var(--color-text-primary); }
</style>
<div class="wrap">
  <h2 class="sr-only">雅思反义词训练 100组</h2>
  <div class="tab-bar" id="tabs">
    <button class="tab active" data-tab="all">全部</button>
    <button class="tab" data-tab="adj">形容词</button>
    <button class="tab" data-tab="v">动词</button>
    <button class="tab" data-tab="n">名词</button>
    <button class="tab" data-tab="adv">副词</button>
    <button class="tab" data-tab="phrase">短语</button>
    <button class="tab" data-tab="learned">已掌握</button>

  <div class="controls">
    <input type="text" id="search" placeholder="搜索单词..." />
    <span class="stat" id="stat"></span>
  </div>
  <div class="grid" id="grid"></div>

let learned = new Set(JSON.parse(localStorage.getItem('ielts_learned')||'[]').filter(x=>x));
let activeTab = 'all';
let query = '';

function save() { try { localStorage.setItem('ielts_learned', JSON.stringify([...learned])); } catch(e){} }

function render() {
  let filtered = data.filter(d => {
    const matchTab = activeTab === 'all' || activeTab === d.pos || (activeTab === 'learned' && learned.has(d.w));
    const matchQ = !query || d.w.includes(query) || d.a.includes(query);
    return matchTab && matchQ;
  });
  document.getElementById('stat').textContent = filtered.length + ' / ' + data.length + ' 组';
  const grid = document.getElementById('grid');
  grid.innerHTML = filtered.map(d => `
    <div class="card${learned.has(d.w)?' learned':''}" data-w="${d.w}" onclick="toggle('${d.w}',event)">
      <button class="learn-btn" onclick="toggleLearn('${d.w}',event)">${learned.has(d.w)?'✓ 已掌握':'标记掌握'}</button>
      <span class="tag ${d.pos}">${{adj:'形容词',v:'动词',n:'名词',adv:'副词',phrase:'短语'}[d.pos]}</span>
      <div class="word">${d.w}</div>
      <div class="arrow">↕</div>
      <div class="antonym">${d.a}</div>
      <div class="meaning">${d.m}</div>
    </div>
  `).join('');
}

function toggle(w, e) {
  if(e.target.classList.contains('learn-btn')) return;
  const card = document.querySelector(`[data-w="${w}"]`);
  card.classList.toggle('open');
}

function toggleLearn(w, e) {
  e.stopPropagation();
  if(learned.has(w)) learned.delete(w); else learned.add(w);
  save(); render();
}

document.getElementById('tabs').addEventListener('click', e => {
  if(!e.target.dataset.tab) return;
  activeTab = e.target.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
  render();
});

document.getElementById('search').addEventListener('input', e => { query = e.target.value.toLowerCase(); render(); });

render();
</script>
